services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: localdev
      POSTGRES_DB: eventhub
    ports:
      - '127.0.0.1:55436:5432'
    volumes:
      - eventhub_db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d eventhub']
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  eventhub_db:
