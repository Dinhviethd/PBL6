x-backend: &backend
  image: eventhub-local
  build: .
  env_file:
    - path: ./server/.env
      format: raw
  environment:
    # Local Docker development, including HTTP cookies and sandbox payments.
    NODE_ENV: development
    HOST: 0.0.0.0
    PORT: 8080
    CLIENT_URL: ${DOCKER_CLIENT_URL:-http://localhost:8000}
    DB_SSL: "true"
    DB_SSL_CA_FILE: /app/certs/supabase-ca.crt
    STATIC_DIR: /app/public
  volumes:
    - type: bind
      source: ./server/.local/certs/supabase-ca.crt
      target: /app/certs/supabase-ca.crt
      read_only: true
      bind:
        create_host_path: false
  init: true
  restart: unless-stopped

services:
  api:
    <<: *backend
    ports:
      - "127.0.0.1:8000:8080"
    volumes:
      - type: bind
        source: ./server/.local/certs/supabase-ca.crt
        target: /app/certs/supabase-ca.crt
        read_only: true
        bind:
          create_host_path: false
      - uploads:/app/.local/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
  worker:
    <<: *backend
    command: ["node", "scripts/worker.cjs"]
    depends_on:
      api:
        condition: service_healthy

volumes:
  uploads:
