name: Build Lightsail release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Build and package image
        shell: bash
        run: |
          set -euo pipefail
          image="eventhub-release:$GITHUB_SHA"
          docker build --platform linux/amd64 -t "$image" .
          docker save "$image" | gzip -1 > eventhub-release.tar.gz
          sha256sum eventhub-release.tar.gz > eventhub-release.tar.gz.sha256

      - name: Upload release files
        uses: actions/upload-artifact@v4
        with:
          name: eventhub-lightsail-release
          path: |
            eventhub-release.tar.gz
            eventhub-release.tar.gz.sha256
          if-no-files-found: error
          retention-days: 3
          compression-level: 0