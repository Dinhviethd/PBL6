name: MVP checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: eventhub_test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json
            mobile/package-lock.json
      - run: npm ci --prefix server
      - run: npm ci --prefix client
      - run: npm ci --prefix mobile
      - run: npm run build
      - run: npm run check
      - name: Install Chromium with retries for transient package mirror failures
        working-directory: client
        run: |
          for attempt in 1 2 3; do
            if npx playwright install --with-deps chromium; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Chromium installation failed (attempt $attempt/3); retrying in 10 seconds."
              sleep 10
            fi
          done
          exit 1
      - run: npm run test:security --prefix client
      - run: npm run test:security-smoke --prefix client
      - name: Upload security test diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: security-test-results
          path: client/test-results/
          if-no-files-found: ignore
          retention-days: 7
      - run: npm run check:mobile
      - run: npm run export --prefix mobile
      - run: npm test
        env:
          TEST_DATABASE_URL: postgresql://postgres:testpass@localhost:5432/eventhub_test
