name: MVP checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: eventhub_test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json
            mobile/package-lock.json
      - run: npm ci --prefix server
      - run: npm ci --prefix client
      - run: npm ci --prefix mobile
      - run: npm run build
      - run: npm run check
      - run: npm run check:mobile
      - run: npm run export --prefix mobile
      - run: npm test
        env:
          TEST_DATABASE_URL: postgresql://postgres:testpass@localhost:5432/eventhub_test

  security:
    name: Browser security checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      # Keep this version aligned with client/package-lock.json.
      # Browsers and OS dependencies are preinstalled; no apt mirrors needed.
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json
      - name: Check Playwright image matches the lockfile
        run: |
          node -e "const v = require('./client/package-lock.json').packages['node_modules/playwright'].version; if (v !== '1.63.0') throw new Error('Update the pinned Playwright container to match the lockfile: ' + v);"
      - run: npm ci --prefix server
      - run: npm ci --prefix client
      - run: npm run build
      - run: npm run test:security --prefix client
      - run: npm run test:security-smoke --prefix client
      - name: Upload security test diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: security-test-results
          path: client/test-results/
          if-no-files-found: ignore
          retention-days: 7
